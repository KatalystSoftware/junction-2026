<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Katalyst at Junction 2026</title>
<meta name="description" content="Team Katalyst's projects at Junction 2026, each with a link to try it.">
<meta property="og:title" content="Katalyst at Junction 2026">
<meta property="og:description" content="Each project with a link to try it.">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230f3d33'/%3E%3Cpath d='M10 7v18M22 7l-9.5 9L22 25' fill='none' stroke='%23b9f27c' stroke-width='4'/%3E%3C/svg%3E">
<link rel="preload" href="fonts/archivo-latin-wdth-normal.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face {
  font-family: "Archivo";
  src: url("fonts/archivo-latin-wdth-normal.woff2") format("woff2");
  font-weight: 100 900;
  font-stretch: 62% 125%;
  font-display: swap;
}

:root {
  --ground: oklch(97% 0.012 165);
  --raised: oklch(99.5% 0.004 165);
  --ink: oklch(24% 0.035 170);
  --soft: oklch(42% 0.03 170);
  --rule: oklch(86% 0.025 165);
  --field: oklch(32% 0.065 168);
  --field-ink: oklch(96% 0.02 150);
  --field-soft: oklch(84% 0.045 160);
  --field-rule: oklch(46% 0.06 168);
  --spark: oklch(89% 0.19 128);
  --spark-ink: oklch(25% 0.06 150);
  --action: oklch(36% 0.085 168);
  --action-ink: oklch(97% 0.02 150);
  --link: oklch(38% 0.1 168);
  --shadow: 0 1px 2px oklch(24% 0.035 170 / 0.08), 0 10px 28px -14px oklch(24% 0.035 170 / 0.28);
}
@media (prefers-color-scheme: dark) {
  :root {
    --ground: oklch(19% 0.022 170);
    --raised: oklch(23% 0.026 170);
    --ink: oklch(94% 0.015 160);
    --soft: oklch(76% 0.03 162);
    --rule: oklch(33% 0.03 168);
    --field: oklch(26% 0.05 168);
    --field-ink: oklch(96% 0.02 150);
    --field-soft: oklch(82% 0.04 160);
    --field-rule: oklch(40% 0.05 168);
    --action: oklch(89% 0.19 128);
    --action-ink: oklch(25% 0.06 150);
    --link: oklch(88% 0.15 132);
    --shadow: 0 1px 2px oklch(10% 0.02 170 / 0.5), 0 12px 30px -14px oklch(8% 0.02 170 / 0.8);
  }
}

*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--ground);
  color: var(--ink);
  font: 400 clamp(1rem, 0.93rem + 0.3vw, 1.25rem)/1.55 "Archivo", system-ui, sans-serif;
  font-stretch: 100%;
  -webkit-font-smoothing: antialiased;
}
::selection { background: var(--spark); color: var(--spark-ink); }
a { color: var(--link); text-underline-offset: 0.18em; text-decoration-thickness: 0.08em; }
a:focus-visible { outline: 3px solid var(--spark); outline-offset: 3px; border-radius: 4px; }
h1, h2, h3, p, ul { margin: 0; }
ul { padding: 0; list-style: none; }
.wrap { width: min(100% - 2rem, 68rem); margin-inline: auto; }
svg.arrow { width: 0.8em; height: 0.8em; flex: none; }

.mast { background: var(--field); color: var(--field-ink); padding-block: clamp(1.4rem, 4vw, 3rem); }
.mast h1 {
  font-weight: 800;
  font-stretch: 125%;
  font-size: clamp(2.6rem, 11vw, 5rem);
  line-height: 0.95;
  letter-spacing: -0.035em;
}
.mast p { margin-top: 0.6rem; color: var(--field-soft); }

/* One article per project. */
.entry {
  display: grid; gap: 1rem 2.5rem;
  padding-block: clamp(1.5rem, 3.5vw, 2.4rem);
  border-bottom: 1px solid var(--rule);
}
.entry .shot {
  display: block; overflow: hidden;
  border-radius: 8px; border: 1px solid var(--rule); background: var(--raised);
  box-shadow: var(--shadow);
}
.entry .shot img { display: block; width: 100%; height: auto; aspect-ratio: 8 / 5; object-fit: cover; object-position: top left; transition: transform 0.5s cubic-bezier(0.16, 1, 0.3, 1); }
.entry a.shot:hover img { transform: scale(1.025); }
.entry h2 {
  font-weight: 800; font-stretch: 118%;
  font-size: clamp(1.45rem, 1.15rem + 1.3vw, 2.1rem);
  line-height: 1.12; letter-spacing: -0.02em; text-wrap: balance;
}
.entry .for { margin-top: 0.25rem; color: var(--soft); font-size: 0.92em; }
.entry .what { margin-top: 0.7rem; max-width: 34em; text-wrap: pretty; }
.entry .acts { margin-top: 1.1rem; display: flex; flex-wrap: wrap; align-items: center; gap: 0.4rem 1.2rem; }
.entry .note { color: var(--soft); font-size: 0.92em; }
.btn {
  display: inline-flex; align-items: center; gap: 0.55rem;
  min-height: 48px; padding: 0.6rem 1.15rem;
  background: var(--action); color: var(--action-ink);
  font-weight: 700; font-stretch: 108%; text-decoration: none;
  border-radius: 8px;
  transition: transform 0.2s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.2s;
}
.btn:hover { transform: translateY(-1px); box-shadow: var(--shadow); }
.btn:active { transform: none; }
.src { display: inline-flex; align-items: center; min-height: 44px; font-weight: 600; }

@media (min-width: 46rem) {
  .entry { grid-template-columns: minmax(0, 5fr) minmax(0, 6fr); align-items: center; }
  .entry.bare { grid-template-columns: minmax(0, 1fr); }
}

.foot { padding-block: 1.6rem 3rem; color: var(--soft); font-size: 0.92em; }

@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; }
}
</style>
</head>
<body>
<header class="mast">
  <div class="wrap">
    <h1>Katalyst</h1>
    <p>Our projects at Junction 2026.</p>
  </div>
</header>

<main class="wrap" id="projects">
  <noscript><p style="padding-top:2rem">This page lists its projects with JavaScript. They are also in <a href="https://github.com/KatalystSoftware/junction2026">the repository</a>.</p></noscript>
</main>

<footer class="wrap foot">
  <p>Built by AI agents, directed by team Katalyst. <a id="repo" href="https://github.com/KatalystSoftware/junction2026">Source on GitHub</a>.</p>
</footer>

<script src="projects.js"></script>
<script>
(function () {
  var data = window.KATALYST;
  var ARROW = '<svg class="arrow" viewBox="0 0 12 12" aria-hidden="true"><path d="M3 9l6-6M4 3h5v5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>';

  function el(tag, cls, text) {
    var node = document.createElement(tag);
    if (cls) node.className = cls;
    if (text) node.textContent = text;
    return node;
  }

  document.getElementById("repo").href = data.repo;
  var main = document.getElementById("projects");

  data.projects.forEach(function (entry) {
    var article = el("article", entry.shot ? "entry" : "entry bare");

    if (entry.shot) {
      var frame = el(entry.live ? "a" : "div", "shot");
      if (entry.live) { frame.href = entry.live; frame.tabIndex = -1; frame.setAttribute("aria-hidden", "true"); }
      var img = el("img");
      img.src = "shots/" + entry.shot;
      img.alt = entry.live ? "" : "Screenshot of " + entry.name;
      img.width = 960; img.height = 600; img.decoding = "async";
      frame.append(img);
      article.append(frame);
    }

    var body = el("div");
    body.append(el("h2", "", entry.name), el("p", "for", entry.for), el("p", "what", entry.what));

    var acts = el("div", "acts");
    if (entry.live) {
      var open = el("a", "btn", (entry.open || "Open " + entry.name) + " ");
      open.href = entry.live;
      open.insertAdjacentHTML("beforeend", ARROW);
      acts.append(open);
    } else if (entry.note) {
      acts.append(el("span", "note", entry.note));
    }
    if (entry.source) {
      var src = el("a", "src", "Source");
      src.href = data.repo + "/tree/main/" + entry.source;
      src.setAttribute("aria-label", "Source of " + entry.name + " on GitHub");
      acts.append(src);
    }
    body.append(acts);
    article.append(body);
    main.append(article);
  });
})();
</script>
</body>
</html>
