<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Katalyst at Junction 2026</title>
<meta name="description" content="Team Katalyst at Junction 2026: an on-call shift that AI agents lose money on, Wikipedia editions compared through time, and recruitment events that start from the last ones.">
<meta property="og:title" content="Katalyst at Junction 2026">
<meta property="og:description" content="Three entries, each with a live demo.">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230f3d33'/%3E%3Cpath d='M10 7v18M22 7l-9.5 9L22 25' fill='none' stroke='%23b9f27c' stroke-width='4'/%3E%3C/svg%3E">
<link rel="preload" href="fonts/archivo-latin-wdth-normal.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face {
  font-family: "Archivo";
  src: url("fonts/archivo-latin-wdth-normal.woff2") format("woff2");
  font-weight: 100 900;
  font-stretch: 62% 125%;
  font-display: swap;
}

:root {
  --ground: oklch(97% 0.012 165);
  --raised: oklch(99.5% 0.004 165);
  --ink: oklch(24% 0.035 170);
  --soft: oklch(42% 0.03 170);
  --rule: oklch(86% 0.025 165);
  --field: oklch(32% 0.065 168);
  --field-ink: oklch(96% 0.02 150);
  --field-soft: oklch(84% 0.045 160);
  --field-rule: oklch(46% 0.06 168);
  --spark: oklch(89% 0.19 128);
  --spark-ink: oklch(25% 0.06 150);
  --action: oklch(36% 0.085 168);
  --action-ink: oklch(97% 0.02 150);
  --link: oklch(38% 0.1 168);
  --shadow: 0 1px 2px oklch(24% 0.035 170 / 0.08), 0 10px 28px -14px oklch(24% 0.035 170 / 0.28);
}
@media (prefers-color-scheme: dark) {
  :root {
    --ground: oklch(19% 0.022 170);
    --raised: oklch(23% 0.026 170);
    --ink: oklch(94% 0.015 160);
    --soft: oklch(76% 0.03 162);
    --rule: oklch(33% 0.03 168);
    --field: oklch(26% 0.05 168);
    --field-ink: oklch(96% 0.02 150);
    --field-soft: oklch(82% 0.04 160);
    --field-rule: oklch(40% 0.05 168);
    --action: oklch(89% 0.19 128);
    --action-ink: oklch(25% 0.06 150);
    --link: oklch(88% 0.15 132);
    --shadow: 0 1px 2px oklch(10% 0.02 170 / 0.5), 0 12px 30px -14px oklch(8% 0.02 170 / 0.8);
  }
}

*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--ground);
  color: var(--ink);
  font: 400 clamp(1rem, 0.93rem + 0.3vw, 1.25rem)/1.55 "Archivo", system-ui, sans-serif;
  font-stretch: 100%;
  -webkit-font-smoothing: antialiased;
}
::selection { background: var(--spark); color: var(--spark-ink); }
a { color: var(--link); text-underline-offset: 0.18em; text-decoration-thickness: 0.08em; }
a:focus-visible { outline: 3px solid var(--spark); outline-offset: 3px; border-radius: 4px; }
h1, h2, h3, p, ul { margin: 0; }
ul { padding: 0; list-style: none; }
.wrap { width: min(100% - 2rem, 68rem); margin-inline: auto; }
svg.arrow { width: 0.8em; height: 0.8em; flex: none; }

.mast { background: var(--field); color: var(--field-ink); padding-block: clamp(1.3rem, 4vw, 3rem) clamp(1.4rem, 3.5vw, 2.6rem); }
.mast h1 {
  font-weight: 800;
  font-stretch: 125%;
  font-size: clamp(2.4rem, 10vw, 4.6rem);
  line-height: 0.95;
  letter-spacing: -0.035em;
}
.mast p { margin-top: 0.8rem; max-width: 30em; color: var(--field-soft); font-size: 1.12em; line-height: 1.45; text-wrap: pretty; }
.mast p a { color: var(--field-ink); font-weight: 650; text-decoration-color: var(--spark); text-decoration-thickness: 0.1em; }
.mast p a:hover { color: var(--spark); }

/* One article per entry. */
.entry {
  display: grid; gap: 1.1rem 2.5rem;
  padding-block: clamp(1.6rem, 3.5vw, 2.6rem);
  border-bottom: 1px solid var(--rule);
  scroll-margin-top: 0.5rem;
}
.entry .shot {
  display: block; overflow: hidden;
  border-radius: 8px; border: 1px solid var(--rule); background: var(--raised);
  box-shadow: var(--shadow);
}
.entry .shot img { display: block; width: 100%; height: auto; aspect-ratio: 8 / 5; object-fit: cover; object-position: top left; transition: transform 0.5s cubic-bezier(0.16, 1, 0.3, 1); }
.entry a.shot:hover img { transform: scale(1.025); }
.entry h2 {
  font-weight: 800; font-stretch: 118%;
  font-size: clamp(1.5rem, 1.15rem + 1.4vw, 2.2rem);
  line-height: 1.1; letter-spacing: -0.02em; text-wrap: balance;
}
.entry .for { margin-top: 0.3rem; color: var(--soft); font-size: 0.92em; }
.entry .what { margin-top: 0.75rem; max-width: 34em; text-wrap: pretty; }
.entry .acts { margin-top: 1.15rem; display: flex; flex-wrap: wrap; align-items: center; gap: 0.3rem 1.3rem; }
.btn {
  display: inline-flex; align-items: center; gap: 0.55rem;
  min-height: 48px; padding: 0.6rem 1.15rem;
  background: var(--action); color: var(--action-ink);
  font-weight: 700; font-stretch: 108%; text-decoration: none;
  border-radius: 8px;
  transition: transform 0.2s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.2s;
}
.btn:hover { transform: translateY(-1px); box-shadow: var(--shadow); }
.btn:active { transform: none; }
.more { display: inline-flex; align-items: center; min-height: 44px; font-weight: 600; }

@media (min-width: 46rem) {
  .entry { grid-template-columns: minmax(0, 5fr) minmax(0, 6fr); align-items: center; }
}

.also { padding-block: clamp(1.4rem, 3vw, 2rem); border-bottom: 1px solid var(--rule); max-width: 44em; }
.also h2 { font-size: 1em; font-weight: 750; font-stretch: 108%; display: inline; }
.also p { display: inline; color: var(--soft); }
.foot { padding-block: 1.4rem 3rem; color: var(--soft); font-size: 0.92em; }

@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; }
}
</style>
</head>
<body>
<header class="mast">
  <div class="wrap">
    <h1>Katalyst</h1>
    <p id="lede"></p>
  </div>
</header>

<main class="wrap" id="projects">
  <noscript><p style="padding-top:2rem">This page lists its entries with JavaScript: <a href="https://incident.katalyst.fyi/">the incident replay</a>, <a href="https://since-when.katalyst.fyi/">Since When</a> and <a href="https://kutsu.katalyst.fyi/">Kutsu</a>.</p></noscript>
</main>

<footer class="wrap foot">
  <p>Team Katalyst, Junction 2026, Espoo. AI agents wrote the code; the team picked the problems and reviewed the results.<span id="repo"></span></p>
</footer>

<script src="projects.js"></script>
<script>
(function () {
  var data = window.KATALYST;
  var ARROW = '<svg class="arrow" viewBox="0 0 12 12" aria-hidden="true"><path d="M3 9l6-6M4 3h5v5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>';

  function el(tag, cls, text) {
    var node = document.createElement(tag);
    if (cls) node.className = cls;
    if (text) node.textContent = text;
    return node;
  }
  function link(cls, text, href) {
    var a = el("a", cls, text);
    a.href = href;
    return a;
  }

  // The opening sentence: data.lede with each entry's `short` as a link to it.
  var lede = document.getElementById("lede");
  lede.append(data.lede + " ");
  data.projects.forEach(function (entry, i, all) {
    lede.append(link("", entry.short, "#" + entry.id), i < all.length - 2 ? ", " : i < all.length - 1 ? " and " : ".");
  });

  var main = document.getElementById("projects");
  data.projects.forEach(function (entry) {
    var article = el("article", "entry");
    article.id = entry.id;

    var frame = link("shot", "", entry.live);
    frame.tabIndex = -1;
    frame.setAttribute("aria-hidden", "true");
    var img = el("img");
    img.src = "shots/" + entry.shot;
    img.alt = "";
    img.width = 960; img.height = 600; img.decoding = "async";
    frame.append(img);

    var body = el("div");
    body.append(el("h2", "", entry.name), el("p", "for", entry.for), el("p", "what", entry.what));
    var acts = el("div", "acts");
    var open = link("btn", entry.open + " ", entry.live);
    open.insertAdjacentHTML("beforeend", ARROW);
    acts.append(open);
    (entry.more || []).forEach(function (m) { acts.append(link("more", m[0], m[1])); });
    if (data.repo) acts.append(link("more", "Source", data.repo + "/tree/main/" + entry.source));
    body.append(acts);

    article.append(frame, body);
    main.append(article);
  });

  if (data.also) {
    var also = el("section", "also");
    also.append(el("h2", "", data.also.name + ". "), el("p", "", data.also.what));
    main.append(also);
  }
  if (data.repo) document.getElementById("repo").append(" ", link("", "Source on GitHub", data.repo), ".");
})();
</script>
</body>
</html>
