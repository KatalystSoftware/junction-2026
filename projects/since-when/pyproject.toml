[project]
name = "since-when"
version = "0.1.0"
description = "What the Finnish, Swedish and English Wikipedia articles on a topic say differently, and since when"
requires-python = ">=3.13"
dependencies = [
    "fastapi==0.162.7",
    "mariadb==1.1.15",
    "mwparserfromhell==0.7.2",
    "torch==2.15.0",
    "transformers==5.23.0",
    "uvicorn==0.54.0",
]

[dependency-groups]
# The loaders read the dump files with DuckDB; the app image has no use for it.
load = ["duckdb>=1.5"]
dev = [
    { include-group = "load" },
    "ruff",
    "ty",
]

[tool.uv]
# gapfinder/ and differences/ run from this directory with python -m; nothing is installed as a package.
package = false

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
# CPU torch only: the API embeds one search question at a time.
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
# The code was written to about this width; ruff's 88 would rewrap a fifth of the lines.
line-length = 120

[tool.ruff.lint]
# SIM115: the commands read a file once in a loop and exit; a with block would re-indent each loop body.
ignore = ["SIM115"]

[tool.ty.environment]
# The image runs 3.13; the dev shell's interpreter is newer.
python-version = "3.13"

# Findings left as they are, shown as warnings so that a new one still fails the check. README lists them.
[[tool.ty.overrides]]
include = ["gapfinder/api.py", "gapfinder/test_live_sql.py"]
[tool.ty.overrides.rules]
# PRESETS holds a title, a parameter list and a function per preset in one dict; ty reads each value as any of them.
not-iterable = "warn"
not-callable = "warn"
# The per-year rows of the timeline are built as mixed dicts.
invalid-assignment = "warn"
not-subscriptable = "warn"
invalid-argument-type = "warn"

[[tool.ty.overrides]]
include = ["gapfinder/align.py", "gapfinder/wikitext.py", "gapfinder/embed.py"]
[tool.ty.overrides.rules]
invalid-argument-type = "warn"
no-matching-overload = "warn"
not-callable = "warn"

[[tool.ty.overrides]]
# Owned by the classifier work on feat/since-when-verify.
include = ["differences/**", "demo/hero_*.py"]
[tool.ty.overrides.rules]
invalid-assignment = "warn"
