# Since When on hestia, against its own scratch database (container gapfinder-scratch-db).
# Run from projects/since-when/: docker compose up --build -d, then http://127.0.0.1:8078.
# Nothing here reaches the gap finder's live server.
name: since-when

services:
  app:
    build: .
    image: since-when
    restart: unless-stopped
    networks: [scratch]
    # Names only: DB_USER, DB_PASSWORD, DB_NAME, and DB_RO_USER, DB_RO_PASSWORD for the Run button.
    env_file: ${HOME}/junction2026-data/mariadb/scratch.env
    environment:
      DB_HOST: gapfinder-scratch-db
      DB_PORT: 3306
    ports: ["127.0.0.1:8078:8078"]
    # No embedding model is mounted, so /api/search finds topics by title alone.
    mem_limit: 1500m
    cpus: 4

networks:
  scratch:
    external: true
    name: gapfinder-scratch-net
