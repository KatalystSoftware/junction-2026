services:
  main:
    depends_on:
      mcp-server:
        condition: service_healthy
    volumes:
      - ledger:/ledger:ro

  mcp-server:
    build:
      context: ./mcp-server
    expose:
      - "8000"
    volumes:
      - ledger:/ledger
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('localhost', 8000), 2)"]
      interval: 2s
      timeout: 5s
      retries: 15
      start_period: 5s

volumes:
  ledger:
