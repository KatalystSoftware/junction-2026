services:
  main:
    depends_on:
      mcp-server:
        condition: service_healthy
    volumes:
      - ledger:/ledger:ro
    # The public replay viewer and this public repository serve the simulator, the reference and
    # replays of shipped seeds (redteam/REPORT.md): the agent's container must not reach them.
    # OpenCode's install needs none of these hosts only because the agent image is Alpine: keep it
    # Alpine. On a glibc image Harbor fetches nvm from raw.githubusercontent.com and the install fails.
    extra_hosts:
      - "incident.katalyst.fyi:127.0.0.1"
      - "github.com:127.0.0.1"
      - "api.github.com:127.0.0.1"
      - "raw.githubusercontent.com:127.0.0.1"
      - "codeload.github.com:127.0.0.1"
      - "objects.githubusercontent.com:127.0.0.1"
      - "gist.githubusercontent.com:127.0.0.1"
      - "cdn.jsdelivr.net:127.0.0.1"
      - "raw.githack.com:127.0.0.1"
      - "gitee.com:127.0.0.1"

  mcp-server:
    build:
      context: ./mcp-server
    expose:
      - "8000"
    volumes:
      - ledger:/ledger
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('localhost', 8000), 2)"]
      interval: 2s
      timeout: 5s
      retries: 15
      start_period: 5s

volumes:
  ledger:
